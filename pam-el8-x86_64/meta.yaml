package:
  name: pam-el8-x86_64
  version: 1.3.1

source:
  - url: https://download.rockylinux.org/vault/rocky/8.9/BaseOS/x86_64/os/Packages/p/pam-1.3.1-27.el8.x86_64.rpm
    sha256: 0a6d22f387c6e3c584365aca2ad0199f14adaa5af5f4d6a71e85498fab24a462
    no_hoist: true
    folder: binary
  # - url: https://download.rockylinux.org/vault/rocky/8.9/BaseOS/source/tree/Packages/p/pam-1.3.1-27.el8.src.rpm
  #   no_hoist: true
  #   folder: source

build:
  skip: True  # [not (linux and x86_64)]
  number: 0
  noarch: generic
  binary_relocation: false
  detect_binary_files_with_prefix: false
  missing_dso_whitelist:
    - '*'

requirements:
  build:
    - sysroot_linux-64 2.28.*
  host:
  run:
    - sysroot_linux-64 2.28.*
    - audit-libs-el8-x86_64 >=1.0.8 *_0
    - libpwquality-el8-x86_64 >=0.9.9 *_0
    - libselinux-el8-x86_64 >=1.33.2 *_0
    - libtirpc-el8-x86_64 >=1.1.4 *_0
    - libxcrypt-el8-x86_64 >=4.1.1 *_0

test:
  commands:
    - test -f ${PREFIX}/x86_64-conda_el8-linux-gnu/sysroot/usr/lib64/libpam.so.0
    - test -f ${PREFIX}/x86_64-conda_el8-linux-gnu/sysroot/usr/lib64/libpam.so.0.84.2

about:
  home: http://www.linux-pam.org/
  license: BSD-3-Clause or GPL-2.0-only  # BSD and GPLv2+
  license_family: GPL2
  license_file:
    - gpl-2.0.txt
    - Copyright
  summary: (CDT) An extensible library which provides authentication for applications
  description: |
    PAM (Pluggable Authentication Modules) is a system security tool that allows
    system administrators to set authentication policy without having to recompile
    programs that handle authentication.
extra:
  recipe-maintainers:
    - conda-forge/help-cdts
