package:
  name: cracklib-devel-el8-x86_64
  version: 2.9.6

source:
  - url: https://vault.almalinux.org/8.9/PowerTools/x86_64/os/Packages/cracklib-devel-2.9.6-15.el8.x86_64.rpm
    sha256: 08f3fc9a80bfd0d2b840c30918226c3c5e9ba5a80859afe4807807e55175de1b
    no_hoist: true
    folder: binary
  # - url: https://download.rockylinux.org/vault/rocky/8.9/BaseOS/source/tree/Packages/c/cracklib-2.9.6-15.el8.src.rpm
  #   no_hoist: true
  #   folder: source

build:
  skip: True  # [not (linux and x86_64)]
  number: 0
  noarch: generic
  binary_relocation: false
  detect_binary_files_with_prefix: false

requirements:
  host:
  run:
    - sysroot_linux-64 2.28.*
    - cracklib-el8-x86_64 ==2.9.6 *_0

test:
  commands:
    - test -f ${PREFIX}/x86_64-conda_el8-linux-gnu/sysroot/usr/include/crack.h
    - test -f ${PREFIX}/x86_64-conda_el8-linux-gnu/sysroot/usr/lib64/libcrack.so

about:
  home: http://sourceforge.net/projects/cracklib/
  license: LGPL-2.1-only  # LGPLv2+
  license_family: LGPL
  license_file:
    - COPYING.LIB
  summary: (CDT) Development files needed for building applications which use cracklib
  description: |
    The cracklib-devel package contains the header files and libraries needed for
    compiling applications which use cracklib.
extra:
  recipe-maintainers:
    - conda-forge/help-cdts
